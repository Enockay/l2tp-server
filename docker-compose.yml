version: '3.8'

services:
  l2tp-server:
    build: .
    container_name: l2tp-vpn-server
    restart: unless-stopped
    privileged: true  # Required for iptables and network configuration
    network_mode: host  # Required for proper VPN functionality
    environment:
      - VPN_SERVER_IP=${VPN_SERVER_IP:-}
      - VPN_SUBNET=${VPN_SUBNET:-10.10.10.0/24}
      - VPN_IP_RANGE=${VPN_IP_RANGE:-10.10.10.2-10.10.10.100}
      - VPN_LOCAL_IP=${VPN_LOCAL_IP:-10.10.10.1}
      - PSK=${PSK:-ChangeThisPreSharedKey}
      - DNS1=${DNS1:-8.8.8.8}
      - DNS2=${DNS2:-8.8.4.4}
    volumes:
      - ./config:/etc/config:ro
      - ./logs:/var/log
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      - net.ipv4.ip_forward=1
    healthcheck:
      test: ["CMD", "ipsec status", "||", "exit", "1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
